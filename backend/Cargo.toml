[package]
name = "mailcrab-backend"
version = "1.11.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
repository = "https://github.com/installerhq/pincer"
description = "Email and SMS test server for development, written in Rust"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.13"
mailcrab = { path = "../mailcrab" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
uuid = { version = "1.24", features = ["v4", "serde"] }

[dev-dependencies]
lettre = { version = "0.11", default-features = false, features=[
    "builder",
    "hostname",
    "rustls-tls",
    "smtp-transport",
    "tokio1-rustls-tls",
    "tokio1"
] }
fake = { version = "5.1", features=["derive"]}
